[workspace]
resolver = "3"
members = ["core", "examples", "integrations/*"]

[workspace.package]
version = "0.75.5-alpha"
edition = "2024"
license = "MIT"
authors = ["HeatCliw"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ron   = "0.8"
log   = "0.4"
rand  = "0.9"

[workspace.metadata.hc]
release  = "0.75.5"
stage    = "alpha"
codename = "Otsu"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3